<div class="leaves-container">

    <div class="header-section">
        <div class="title-group">
            <h1>{{ 'Leaves & Time Off' | translate }}</h1>
            <p class="subtitle">{{ 'Manage your leave applications and track your balances' | translate }}</p>
        </div>
        <button class="apply-btn" id="apply-leave" (click)="toggleApplyModal()">{{ 'Apply for Leave' | translate }}</button>
    </div>

    <!-- BALANCE CARDS -->
    <div class="balance-grid" id="leave-balance">
        <!-- Skeleton State -->
        <ng-container *ngIf="isLoading">
            <div class="balance-card" *ngFor="let i of [1,2,3]">
                <div class="skeleton-shimmer" style="height: 12px; width: 60%; margin-bottom: 24px;">&nbsp;</div>
                <div class="skeleton-shimmer" style="height: 32px; width: 40%; margin-bottom: 24px;">&nbsp;</div>
                <div class="skeleton-shimmer" style="height: 8px; width: 100%;">&nbsp;</div>
            </div>
        </ng-container>

        <!-- Real Data State -->
        <ng-container *ngIf="!isLoading">
            <div class="balance-card" *ngFor="let balance of leaveBalances">
                <div class="card-header">
                    <span class="type">{{ balance.type | translate }}</span>
                </div>
                <div class="card-body">
                    <span class="current">{{ balance.current }}</span>
                    <span class="total">/ {{ balance.total }} {{ 'Days Left' | translate }}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" [style.width]="(balance.current / balance.total * 100) + '%'"
                        [style.backgroundColor]="balance.color"></div>
                </div>
            </div>
        </ng-container>
    </div>




    <!-- APPLY MODAL -->
    <div class="modal-overlay" *ngIf="showApplyModal" (click)="toggleApplyModal()">
        <div class="modal-card" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h3>{{ 'New Leave Application' | translate }}</h3>
                <button class="close-btn" (click)="toggleApplyModal()">&times;</button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label>{{ 'Leave Type' | translate }}</label>
                    <select [(ngModel)]="newLeave.type">
                        <option *ngFor="let b of leaveBalances" [value]="b.type">{{ b.type | translate }}</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>{{ 'Start Date' | translate }}</label>
                        <input type="date" [(ngModel)]="newLeave.startDate">
                    </div>
                    <div class="form-group">
                        <label>{{ 'End Date' | translate }}</label>
                        <input type="date" [(ngModel)]="newLeave.endDate">
                    </div>
                </div>

                <div class="form-group">
                    <label>{{ 'Reason for Leave' | translate }}</label>
                    <textarea rows="3" [placeholder]="'Explain your reason briefly...' | translate"
                        [(ngModel)]="newLeave.reason"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button class="cancel-btn" (click)="toggleApplyModal()">{{ 'Cancel' | translate }}</button>
                <button class="submit-btn" (click)="submitLeave()">{{ 'Submit Application' | translate }}</button>
            </div>
        </div>
    </div>

</div>
