<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

<!-- SIDEBAR -->
<div class="sidebar" [class.active]="isMobileMenuOpen">
  <div class="sidebar-header">
    <button class="close-mobile-btn" (click)="closeMobileMenu()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-label">Main Menu</div>
      <a routerLink="profile" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        <span class="nav-label">Employee Profile</span>
      </a>
      <a routerLink="attendance" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        <span class="nav-label">Attendance Register</span>
      </a>
      <a routerLink="leaves" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        <span class="nav-label">Leaves & Time Off</span>
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-label">System</div>
      <a routerLink="settings" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        <span class="nav-label">Settings</span>
      </a>
      <a routerLink="help" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        <span class="nav-label">Help Center</span>
      </a>
    </div>
  </nav>

  <!-- Profile Footer -->
  <div class="sidebar-footer">
    <div class="minimal-profile">
      <div class="profile-meta">
        <div class="user-avatar">{{ getInitials() }}</div>
        <div class="user-info">
          <div class="user-name">{{ employeeFullName }}</div>
          <div class="user-id">{{ employeeId }}</div>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>
</div>

<!-- BLUE BAR -->
<div class="top-bar">
  <div class="sidebar-align-container">
    <img src="assets/images/pranali_logo_2.png" alt="Pranali Logo" class="header-logo">
  </div>
</div>

<!-- CHILD ROUTE CONTENT -->
<div class="shell-content">
  <div class="mobile-header-backdrop" [class.hidden]="isMobileMenuOpen" *ngIf="!isMobileMenuOpen"></div>
  <button class="mobile-menu-btn" [class.hidden]="isMobileMenuOpen" *ngIf="!isMobileMenuOpen"
    (click)="toggleMobileMenu()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
  <router-outlet></router-outlet>
</div>

<!-- LOGOUT CONFIRMATION MODAL -->
<div class="modal-overlay modal-logout" *ngIf="showLogoutConfirm" (click)="cancelLogout()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <h3 class="modal-title">Logout</h3>
      <p class="modal-text">Do you want to logout from pranali?</p>
      <div class="modal-actions">
        <button class="modal-btn cancel" (click)="cancelLogout()">Cancel</button>
        <button class="modal-btn confirm" (click)="confirmLogout()">Confirm</button>
      </div>
    </div>
  </div>
</div>
